---
# Dictionary of Terms: Clauding for Programmers
# Authoritative definitions for concepts used across the book.

terms:

  # --- Core Concepts ---

  - term: Clauding
    definition: >
      The practice of externalizing both behavioral and constructional
      intent into machine-readable artifacts (specifications, constitutions,
      architectural constraints), then using coding agents to generate code
      from those artifacts while verifying the output through automated
      gates rather than manual review.
    chapter: 1
    see_also: [Behavioral Intent, Constructional Intent]

  - term: Behavioral Intent
    definition: >
      The specification of what the software does: inputs, outputs, edge
      cases, error handling, and observable behavior.
    chapter: 1
    see_also: [Constructional Intent, Specification]

  - term: Constructional Intent
    definition: >
      The specification of how the software is built: module boundaries,
      naming conventions, function size limits, design patterns, and
      architectural constraints.
    chapter: 1
    see_also: [Behavioral Intent, Architecture Document]

  - term: Specification
    definition: >
      The complete declarative definition of what the software does and
      how it is structured. Comprises multiple layers: requirements (PRD),
      architecture document, use cases, test suite, constitutions, and
      domain knowledge references. The specification is the source code
      in the generative model; generated code is the compiled artifact.
      Updating the software means updating the specification.
    layers: [Requirements, Architecture, Use Cases, Test Suite, Constitution, Domain Knowledge]
    chapter: [1, 2]
    see_also: [Specification Delta, Transient Code]

  - term: Specification Delta
    definition: >
      The difference between the current specification and what the
      project now requires. The input to the regeneration cycle. A
      delta targets specific specification layers — most commonly
      requirements (new features) and use cases (new functionality).
      Architecture deltas are the most expensive because they affect
      all downstream layers.
    types: [Requirement Delta, Use Case Delta, Architecture Delta, Test Delta]
    chapter: [2, Part V]
    see_also: [Evolution, Specification]

  # --- Specification Layers ---

  - term: Requirements (PRD)
    full_name: Product Requirements Document
    definition: >
      The architectural layer of a specification. Defines the structural
      skeleton: component boundaries, interfaces, module organization,
      data flow, technology stack, and non-functional requirements. The
      most stable specification layer — it changes rarely, and when it
      does, the change affects all downstream layers.
    stability: stable
    consumed_by: Measure phase (task decomposition)
    see_also: [Specification, Architecture Document]

  - term: Architecture Document
    definition: >
      The structural decisions that persist across regeneration cycles.
      Module boundaries, naming conventions, patterns, constraints. The
      architecture evolves independently of any particular generated
      implementation. The skeleton that the generated code (the muscle)
      attaches to.
    stability: stable
    consumed_by: Agent (context assembly)
    see_also: [Constructional Intent, Requirements]

  - term: Use Case
    definition: >
      A structured, machine-parseable declaration of functionality. Each
      use case specifies dependencies (forming a DAG), priority,
      preconditions, scenarios, postconditions, and acceptance criteria
      linking to specific tests. Use cases enable automatic task ordering
      (via dependency DAG) and incremental generation (via iteration
      assignment).
    stability: grows
    consumed_by: Measure phase (task ordering), Agent (implementation guidance)
    see_also: [Specification, Increment]

  - term: Test Suite
    definition: >
      The executable specification of correctness. Comprises unit tests,
      integration tests, and acceptance tests. Constitutes 50% or more of
      the generated codebase. Grows monotonically — new tests are added
      during evolution, existing tests are never removed. Serves as both
      the verification mechanism for the generation cycle and the
      regression safety net during evolution.
    stability: grows monotonically
    consumed_by: Verification (inner loop)
    see_also: [Verification Stack, Verification Gate]

  - term: Constitution
    definition: >
      A document containing prohibitive rules that constrain agent behavior
      during generation. Constitutions say "don't do X" and "you must
      follow rule Y." They are stable across projects — every project using
      the same orchestrator uses the same constitutions regardless of what
      it builds. Constitutions constrain HOW the agent works; the
      specification declares WHAT the agent builds.
    stability: stable
    chapter: Part II
    see_also: [Guardian, Specification]

  - term: Domain Knowledge
    definition: >
      External context that grounds the agent in the specifics of the
      project's domain. Includes API documentation, protocol specifications,
      library documentation, and operational patterns. Not authored as part
      of the specification but referenced by it.
    stability: external
    consumed_by: Agent (context assembly)
    see_also: [Knowledge Manager, Context Window]

  # --- The Two Loops ---

  - term: Inner Loop
    definition: >
      The per-task development cycle: specify a task, generate code,
      verify (compile, lint, test), fix errors, repeat until the task
      passes. With agents, this loop is automated by the harness.
    chapter: 2
    see_also: [Outer Loop, Agent Harness]

  - term: Outer Loop
    definition: >
      The per-project development cycle: gather requirements, make
      architectural decisions, identify the next increment, run the
      inner loop, verify the increment end-to-end, repair defects,
      and periodically assess structural quality. The programmer drives
      this loop (at L3) or reviews a proposed plan (at L4).
    steps: [Plan, Build, Verify, Repair, Improve]
    chapter: 2
    see_also: [Inner Loop, Tracer Bullet, AADE Loop]

  - term: Tracer Bullet
    definition: >
      The thinnest slice of functionality that works end-to-end through
      the system. A tracer bullet touches every component it needs but
      implements only enough of each to make one feature work. It proves
      the architecture before the architecture is complete.
    chapter: 2
    see_also: [Increment, Outer Loop]

  - term: Increment
    definition: >
      One pass through the outer loop. An increment adds a working
      end-to-end slice of functionality to the system. Each increment
      is verified before the next builds on top of it. Increments can
      be lumpy — one may require significant data model work and a
      trivial API endpoint.
    chapter: 2
    see_also: [Tracer Bullet, Verification Gate]

  - term: Verification Gate
    definition: >
      The set of automated checks that must pass after an increment
      before construction proceeds to the next. Gates prevent defects
      from accumulating across increments. A gate is not just "tests
      pass" — it is a deliberate checkpoint confirming the system still
      works end-to-end.
    chapter: 2
    see_also: [Verification Stack, Increment]

  # --- The Machine ---

  - term: Large Language Model (LLM)
    definition: >
      A neural network trained on a large text corpus to predict the
      next token in a sequence. At inference time, the model generates
      text by iteratively predicting one token at a time, conditioned
      on the full context provided. The model interpolates from patterns
      in training data — it does not retrieve, reason, or verify.
    chapter: 3
    see_also: [Interpolation, Context Window, Token]

  - term: Token
    definition: >
      The atomic unit of text that a language model processes. Produced
      by a deterministic tokenizer that maps text strings to numerical
      identifiers. Common words map to single tokens. Uncommon words,
      technical terms, and code are split into multiple tokens.
    chapter: 3
    see_also: [Context Window]

  - term: Context Window
    definition: >
      The maximum number of tokens a model can process and generate in
      a single request. Includes input (system prompt, conversation
      history, tool definitions, source files) and output (the model's
      response, including reasoning). Everything the model knows about
      the current task must fit within this window.
    chapter: 3
    see_also: [Token, Knowledge Manager]

  - term: Interpolation
    definition: >
      The process by which a model constructs a response by finding the
      point in its learned space most consistent with the provided
      context. More than pattern matching (it generalizes), less than
      reasoning (it does not verify its own output). Powerful when the
      target is adjacent to training data. Fails when the target is
      novel — and does not know the difference.
    chapter: 3
    see_also: [Confident Miscalibration, Interpolation Density]

  - term: Interpolation Density
    definition: >
      The concentration of training data patterns in a given region of
      the model's learned space. Denser regions produce more reliable
      generation. High-resource languages (Python, Go, JavaScript) have
      dense interpolation spaces. Low-resource languages (OCaml, Racket)
      have sparse ones.
    chapter: 4
    see_also: [Interpolation, Language-Model Pairing]

  - term: Confident Miscalibration
    definition: >
      The failure mode where the model generates fluent, confident output
      regardless of whether the interpolation is correct. There is no
      internal uncertainty signal. Surface inspection is unreliable as
      a verification method.
    chapter: 3
    see_also: [Interpolation, Verification Stack]

  # --- The Harness and Agents ---

  - term: Agentic Loop
    definition: >
      The cycle by which a language model takes actions: the model
      generates a response that includes structured tool calls, a
      harness executes those calls, the results are appended to context,
      and the model generates the next response. Repeats until
      completion or a stop condition.
    chapter: 3
    see_also: [Agent Harness, Tool]

  - term: Agent Harness
    definition: >
      The orchestration layer around a language model that manages
      prompts, tool execution, policy checks, and loop control for
      autonomous agent behavior. Claude Code is a harness. The
      Anthropic Agent SDK builds harnesses. The harness runs the inner
      loop for a single task.
    chapter: 3
    see_also: [Agentic Loop, Orchestrator]

  - term: Orchestrator
    definition: >
      The system that manages the outer loop — task decomposition,
      dependency ordering, state tracking, verification gates, and
      transitions between increments. The orchestrator drives the
      harness with the right tasks in the right order. Cobbler-scaffold
      is an orchestrator.
    chapter: Part V
    see_also: [Agent Harness, Inner Loop, Outer Loop]

  # --- Language Selection ---

  - term: Language-Model Pairing
    definition: >
      The combination of a programming language and a model, evaluated
      by how reliably the model generates correct code in that language.
      A strong pairing produces code that compiles, passes tests, and
      matches the specification on the first or second attempt.
    chapter: 4
    see_also: [Interpolation Density, Corpus Uniformity]

  - term: Corpus Uniformity
    definition: >
      The degree to which a language's public code follows consistent
      patterns. More uniform corpora produce tighter interpolation
      spaces. Languages with enforced formatting (Go/gofmt, Rust/rustfmt)
      have higher corpus uniformity than languages with diverse style
      conventions.
    chapter: 4
    see_also: [Interpolation Density, Language-Model Pairing]

  - term: FSM-Constrained Decoding
    definition: >
      A technique that compiles a grammar into a finite state machine
      and masks invalid tokens at each decode step, guaranteeing
      syntactically valid output. Simpler grammars produce smaller FSMs
      with less distribution distortion.
    chapter: 4
    see_also: [Language-Model Pairing]

  # --- Verification ---

  - term: Verification Stack
    definition: >
      Multiple independent automated layers, each catching a different
      class of defect: compilation (syntax/types), linting (structure),
      tests (behavior), coverage (test adequacy), specification
      conformance (spec match), and intent conformance (human judgment).
      No single layer is sufficient.
    chapter: [1, 5]
    see_also: [Verification Gate, Confident Miscalibration]

  - term: Differential Testing
    definition: >
      Running two implementations of the same specification on the same
      inputs and comparing outputs. Any discrepancy reveals a defect in
      at least one. Requires no oracle other than agreement. Used at
      go-unix-utils to verify generated code against GNU coreutils.
    chapter: [Part III, Part V]
    see_also: [Verification Stack]

  - term: Mutation Testing
    definition: >
      Injecting small faults (mutants) into code and running the test
      suite against each mutant. If a mutant survives (tests still pass),
      the tests have a gap. The mutation score — percentage of mutants
      killed — is the most robust known metric for test adequacy.
    chapter: Part III
    see_also: [Verification Stack, Test Suite]

  # --- Transient Code ---

  - term: Transient Code
    definition: >
      Code that does not need to persist. Generated when needed, verified,
      used, and replaced when the specification evolves. The code is
      correct and production-quality — "transient" means it does not need
      to survive, not that it does not matter. Like a compiled binary:
      correct, necessary, not the thing you version.
    chapter: [2, articles]
    see_also: [Specification, Software Entropy]

  - term: Software Entropy
    definition: >
      The tendency of code to decay as changes accumulate. With agent-
      generated code, entropy is accelerated — each increment is
      generated independently with no memory of prior structural
      decisions. Periodic structural review (the Improve step of the
      outer loop) counters entropy.
    chapter: 2
    see_also: [Outer Loop, Transient Code]

  # --- Orchestration Phases (Cobbler) ---

  - term: Measure
    definition: >
      The planning phase of the orchestration cycle. Reads the
      specification, queries current project state, and proposes tasks
      (GitHub issues with dependencies). Maps to the Plan step of the
      outer loop. Analogous to make-work.
    cobbler_phase: measure
    chapter: Part V
    see_also: [Stitch, Orchestrator]

  - term: Stitch
    definition: >
      The implementation phase. Picks a ready task, creates an isolated
      worktree, invokes the agent with task context, commits changes,
      merges back. Maps to the Build step of the outer loop. Analogous
      to do-work.
    cobbler_phase: stitch
    chapter: Part V
    see_also: [Measure, Inspect]

  - term: Inspect
    definition: >
      The verification phase. Runs the full verification stack after
      generation — not just tests, but linting, coverage, mutation
      testing, security scanning, specification conformance. Maps to
      the Verify step of the outer loop. Produces a pass/fail report
      that feeds into Mend if issues are found.
    cobbler_phase: inspect
    chapter: Part V
    see_also: [Stitch, Mend, Verification Stack]

  - term: Mend
    definition: >
      The repair phase. Takes a defect report from Inspect and produces
      a fix. Different from Stitch — the context is diagnostic (error
      messages, failing tests, original spec), the success criterion
      includes no regressions, and the retry logic differs.
    cobbler_phase: mend
    chapter: Part V
    see_also: [Inspect, Stitch]

  - term: Pattern
    definition: >
      The structural quality phase. Analyzes accumulated code for
      inconsistencies, duplication, and drift from the architecture.
      Produces refactoring proposals that feed back into Measure as
      new tasks. Counters software entropy.
    cobbler_phase: pattern
    chapter: Part V
    see_also: [Measure, Software Entropy]

  # --- Agent Roles ---

  - term: Planner
    definition: >
      The agent role responsible for decomposing work into tasks. In
      cobbler, this is the Measure phase. The Planner reads the
      specification and current state, identifies what needs to be
      built, and produces an ordered task list.
    coding_analogue: cobbler measure, make-work
    chapter: Part V
    see_also: [Executor, Orchestrator]

  - term: Executor
    definition: >
      The agent role responsible for generating code from a task
      specification. In cobbler, this is the Stitch phase. The Executor
      receives a task, assembles context, generates code, and produces
      a commit.
    coding_analogue: cobbler stitch, do-work
    chapter: Part V
    see_also: [Planner, Critic]

  - term: Critic
    definition: >
      The agent role responsible for verification — evaluating whether
      generated output matches the specification. In cobbler, this is
      the Inspect phase. The Critic runs the verification stack and
      produces a pass/fail assessment.
    coding_analogue: cobbler inspect
    chapter: Part V
    see_also: [Executor, Guardian]

  - term: Guardian
    definition: >
      The agent role responsible for policy enforcement. Always active —
      not a phase but a continuous constraint. Enforced mechanically
      (harness tool permissions) and probabilistically (constitution in
      context). Constitutions are the soft Guardian; the harness is the
      hard Guardian.
    coding_analogue: constitution + harness policy
    chapter: Part II
    see_also: [Constitution, Agent Harness]

  - term: Monitor
    definition: >
      The agent role responsible for observability — collecting telemetry
      from the generation process. Compiler output, test results, token
      costs, turn counts, context utilization. The Monitor provides the
      data that the Analyst interprets.
    coding_analogue: logging, metrics collection
    chapter: Part VI
    see_also: [Analyst]

  - term: Analyst
    definition: >
      The agent role responsible for interpreting observations. Diagnoses
      errors, identifies failure patterns, recognizes recurring issues.
      In cobbler, the Analyst function drives the Pattern phase — looking
      at the accumulated code and identifying structural problems.
    coding_analogue: cobbler pattern, error diagnosis
    chapter: Part V
    see_also: [Monitor, Pattern]

  - term: Coordinator
    definition: >
      The agent role responsible for managing interactions between
      multiple agents working on related tasks. Handles dependency
      ordering, conflict resolution, context sharing, and consensus
      when multiple agents propose different approaches.
    coding_analogue: cobbler task scheduling, merge management
    chapter: Part V
    see_also: [Orchestrator, Collaborator]

  - term: Knowledge Manager
    definition: >
      The agent role responsible for context engineering — deciding what
      goes into the context window, how it is structured, and when it is
      updated. Different phases need different context. The Knowledge
      Manager curates what each agent knows at each moment.
    coding_analogue: context assembly, RAG, memory management
    chapter: Part V
    see_also: [Context Window, Domain Knowledge]

  - term: Creator
    definition: >
      The agent role responsible for agent instantiation and lifecycle
      management. In coding, this maps to spinning up sub-agents,
      managing worktrees, and handling the lifecycle of parallel
      generation instances.
    coding_analogue: worktree management, sub-agent lifecycle
    chapter: Part V
    see_also: [Agent Factory, Orchestrator]

  # --- Lifecycle ---

  - term: Genesis
    definition: >
      Creating new software from specifications when no implementation
      exists. The pipeline: identify the need, compose the specification,
      run the generation cycle against an empty codebase, validate,
      deploy. Genesis is constructive — building from nothing.
    chapter: Part V
    see_also: [Evolution, Specification]

  - term: Evolution
    definition: >
      Modifying existing software by changing its specification and
      regenerating affected code. The pipeline: detect the gap, author
      a specification delta, merge with existing specification, run gap
      analysis, generate changes, validate (regression + new tests),
      deploy with rollback capability. Evolution is surgical — modifying
      what exists while preserving what works.
    chapter: Part V
    see_also: [Genesis, Specification Delta]

  - term: Drift
    definition: >
      The state where the software's current specification no longer
      matches what the project requires. Drift accumulates continuously.
      Small specification gaps may not matter. Accumulated gaps
      eventually make the software incorrect for its current context.
      The threshold for triggering evolution is a judgment call.
    chapter: Part V
    see_also: [Evolution, Software Entropy]

  # --- Autonomy Levels ---

  - term: Autonomy Level
    definition: >
      A classification of how much of the plan-and-execute cycle a
      system handles without human direction. Ranges from L0 (fully
      manual) to L5 (fully self-managing).
    levels:
      L0: Manual — programmer types every line
      L1: Assisted — AI suggests completions
      L2: Partial — AI implements within bounded scope, programmer approves
      L3: Conditional — AI implements from specifications, programmer writes specs
      L4: High — AI proposes its own work breakdown, programmer reviews
      L5: Recursive — system manages its own evolution from intent alone
    chapter: 1
    see_also: [Software Factory, Specification Factory]

  - term: Software Factory
    definition: >
      A system that compiles specifications into working code through
      the measure/stitch cycle. Available at L4+. Takes specifications
      as input and produces working code as output. Cobbler-scaffold
      is a software factory.
    autonomy_level: L4+
    chapter: Part V
    see_also: [Specification Factory, Orchestrator]

  - term: Specification Factory
    definition: >
      A system that transforms objectives into specifications that
      software factories can compile. Automates architectural decisions,
      module decomposition, interface design, acceptance criteria.
      Available at L5. Does not exist yet in practice.
    autonomy_level: L5
    chapter: Part V
    see_also: [Software Factory, Autonomy Level]

  # --- AADE Loop ---

  - term: AADE Loop
    definition: >
      Assure-Analyze-Decide-Execute. A general cognitive loop framework
      underlying both the inner and outer loops. Assure: observe current
      state (Monitor). Analyze: interpret observations (Analyst). Decide:
      plan the intervention (Planner). Execute: carry out the plan
      (Executor). Same pattern as OODA (military), PDCA (manufacturing),
      and the scientific method.
    phases: [Assure, Analyze, Decide, Execute]
    chapter: Part V
    see_also: [Inner Loop, Outer Loop]

  # --- Sampling ---

  - term: Sampling
    definition: >
      The process of selecting the next token from the model's predicted
      probability distribution. Controlled by temperature (pre-softmax
      logit adjustment), top-k (keep k most likely tokens), and top-p
      (keep smallest set summing to p). Lower values produce more
      predictable output.
    chapter: 3
    see_also: [Token, LLM]

  # --- Component Types ---

  - term: Guided Component
    definition: >
      An LLM-based agent with self-programming and limited self-
      reflection capabilities, operating under human-on-the-loop
      oversight. Can generate code but requires external direction for
      task decomposition and architectural decisions. Current coding
      agents (Claude Code, Cursor, Copilot) are guided components.
    capabilities: [self-programming, self-reflection (limited)]
    chapter: Part V
    see_also: [Recursive Component, Agent Harness]

  - term: Recursive Component
    definition: >
      An advanced agent exhibiting all four autogenic capabilities:
      self-programming, self-reflection, self-orienting, and self-
      architecting. Can autonomously decompose requirements, generate
      plans, produce code, and validate output without per-iteration
      human intervention. Not yet fully achieved — orchestrators like
      cobbler approximate recursive behavior by coordinating guided
      components.
    capabilities: [self-programming, self-reflection, self-orienting, self-architecting]
    chapter: Part V
    see_also: [Guided Component, Software Factory]
