# SRD 1.6 -- Externalizing memory.
# Drafting contract per docs/srd/README.md (GH-17).

meta:
  chapter: C1.6
  title: Externalizing memory
  parent: P1
section_goal: establish where state lives between sessions, and mark the point where the human leaves the loop
goals:
  - id: G1.13
    goal: The reader can explain why nothing survives a session unless it is written where the harness can read it back.
  - id: G1.14
    goal: The reader can identify what in their own practice is carried in their head and would have to be externalized.
  - id: G1.15
    goal: The reader can name the moment the human leaves the loop, and what has to be true before that is safe.
  - id: G6.3
    goal: The reader can give the build-thread skeleton externalized memory -- state written at session end and read back at the next start -- closing Part I's increment (added at GH-63).
chain:
  - id: Q5
    owns: partial
    note: "Owns the mechanism half -- that memory has to live somewhere reachable. Part II owns what to write in it."
constitutions:
  - file: ../constitutions/voice.yaml
    rules: [V-S2, V-S4, V-S6, V-S7, V-P3, V-V4]
    note: "V-V4 binds hardest: this chapter is the hinge into practice and will pull toward instruction. It must stay observation. V-S7 governs the Build section added at GH-63, which sits after the hinge and closes the part's increment."
  - file: ../constitutions/argument.yaml
    rules: [A-C1, A-C4, A-X1]
    note: "A-X1: the hinge chapter is where prescription most easily leaks into Part I. It establishes the fact; Part II prescribes from it."
  - file: ../constitutions/venue.yaml
    rules: [VN-3, VN-8]
objective: >
  It shows that the model retains nothing between sessions, that the harness's
  only memory is what was written down, and that this is the mechanism behind
  every artifact Parts II-VI ask for -- then names the moment the human stops
  supplying the missing context, which is where the rest of the book begins.
prior_material:
  - path: cobbler-scaffold
    offers: state carried across sessions in specifications, constitutions, and an issue tracker, with the failures when it was not committed
  - path: coding-skills
    offers: the GitHub issue loop as externalized memory the harness reads back on the next run
  - path: go-unix-utils
    offers: specifications as the artifact that survived regeneration while the code did not
citations:
  - id: liu2023
    role: evidence
    note: what the context window can hold and where attention degrades; the mechanical bound on carrying state in-session
  - id: latentpatterns-harness
    role: anchor
    note: the harness as the component that reads external state back into context
  - id: hunt1999
    role: context
    note: the practitioner lineage for writing things down; cited to place the idea, not to derive it
  - id: tmforum-ig1218
    role: context
    note: >
      Added at GH-11. The published autonomy scale section 6.5 uses as
      vocabulary. Same source C1.1 uses to make the opposite point, which the
      two passages reconcile explicitly.
  - id: du2026
    role: anchor
    note: >
      Survey of agent memory, 2022 to early 2026. Formalizes memory as a
      write-manage-read loop coupled to perception and action, and names five
      mechanism families -- context-resident compression, retrieval-augmented
      stores, reflective self-improvement, hierarchical virtual context,
      policy-learned management. Supplies the vocabulary this chapter needs for
      what harnesses actually do about the context bound.
content:
  - say: "A session ends and the model retains nothing. The next session begins with whatever the harness puts in context and nothing else."
    cites: [latentpatterns-harness]
  - say: "In-session memory is bounded and uneven: the window has a size, and position inside it changes what gets used."
    cites: [liu2023]
  - say: "So anything that must survive has to be written where the harness can reach it: a specification, a constitution, a tracker, a committed artifact."
    cites: []
  - say: "This is the mechanism behind every artifact the rest of the book asks for. The artifacts are not process ceremony; they are the only memory the system has."
    cites: []
  - say: "The programmer is themselves a memory device, supplying the missing context each session by answering questions and correcting course."
    cites: []
  - say: "The moment the human leaves the loop is the moment that stops. What was carried in their head is either written down or it is gone, and the loop proceeds on what remains."
    cites: [hunt1999]
  - say: "The Build section gives the skeleton a notes file read at Start and appended at End, making the gap an if-statement. The unsupplied decision argument locates the wiring question of 6.4 in a call site, and the closing paragraph hands the part to Part II: the skeleton can read; the artifacts worth reading are the practice parts' subject. Evidence type is mechanism."
    cites: []
apparatus:
  objectives:
    - Explain why nothing survives a session unless it is externalized.
    - Identify what you currently carry in your head that the harness cannot see.
    - Name what must be true before the human can leave the loop.
    - Give the skeleton a memory that survives the session gap, written at exit and read back at the next start.
  sidebars:
    - type: Common Error
      about: assuming a correction made in one session persists into the next
    - type: From the Field
      about: the run that failed because state was never committed, and what it cost
  key_terms: [externalized_memory, human_in_the_loop, human_on_the_loop, autonomy_level]
  key_terms_ownership_note: >
    context_window dropped at GH-88: C1.5 introduces it and carries its boxed
    definition. The table keeps the row.
  key_terms_note: >
    knowledge_manager, specification, and constitution dropped at GH-50.
    definitions.yaml puts knowledge_manager at P5 and constitution at C2.5, and
    specification has no owner yet (GH-53). The chapter refers to all three as
    things that cross the session gap; Part II and Part V define them.
figures:
  - shows: "Two sessions separated by a gap, showing what crosses it -- committed artifacts and tracker state -- and what does not: conversation, corrections, and the programmer's unwritten intent."
    status: drawn
    path: figures/fig-6-1-what-crosses-the-gap.puml
    label: "Figure 6.1"

links:
  requires: [C1.3, C1.4, C1.5]
  supports: [C2.3, C2.4, C2.5, C5.3, C5.6]
gaps:
  - >
    Answered at GH-11. The autonomy levels arrive HERE, in section 6.5, not in
    Part II. Three reasons. C2.1 section 2.6 already depends on them being
    defined in Part I and uses L2/L3/L4 substantively, so A-C4 needs a Part I
    fact for it to point at. G1.15 asks the reader to name the moment the human
    leaves the loop, and the levels are the scale for exactly that. And the
    levels measure how much context has been externalized, which is this
    chapter's subject. Only the boxed definition and the L0/L5 endpoints are
    given here; the per-level walkthrough and the two bottleneck tables stay
    parked and need a Part II home.
  - >
    Correction to the premise of the gap above: the introduction does NOT frame
    the book on the autonomy levels. 01-introduction.md is 379 words with three
    sections and does not mention them. The road-map `unplaced` entry asserting
    otherwise was stale and is corrected under GH-11.
  - >
    C1.1 section 1.1 cites tmforum-ig1218 to set the autonomy scales aside as a
    definition of what an agent is. Section 6.5 picks that up explicitly and
    distinguishes the two jobs -- useless as a definition, right-shaped as a
    measure of delegation. If either passage is edited, keep them in agreement.
acceptance:
  - Every citation id resolves in references.yaml.
  - The chapter establishes the mechanism without prescribing what to write (A-X1); Part II owns that.
  - The hinge is explicit: the chapter closes by naming what Parts II-VI derive from it.
  - The autonomy-levels question is answered rather than left implicit.
