# voice.yaml -- constitution for how the book sounds and how a chapter is
# built. Governs: the repository's numbered chapters (GH-16).
#
# Distillation source: idea-factory .claude/rules/book-voice.md, ported here
# as checkable rules. Rules are distilled, not invented; each names its
# source. The register combines three models named in VISION.yaml (exemplar):
# Deitel & Deitel for the chapter apparatus, Fowler for precision, and the
# author's results-without-advocacy tone.

meta:
  book: "Agentic Coding"
  governs: "NN-slug.md at the repository root"
  version: 1

# Rules governing how a chapter is assembled. Each carries a `check` a
# reviewer or mage audit can apply without reading for taste.
structure_rules:
  - id: V-S1
    name: learning_objectives
    rule: "Every chapter opens with a numbered list of what the reader will be able to do after reading it -- not what the chapter covers."
    check: "First heading after the title is 'Learning Objectives'; every entry starts with a capability verb (explain, identify, distinguish, evaluate, given X do Y), not 'understand' or 'learn about'."
    source: "book-voice.md rule 1"
  - id: V-S2
    name: section_opens_with_problem
    rule: "Every section opens with the problem it solves, stated before the method."
    check: "No section begins 'This section discusses/covers/introduces'. The first sentence names a failure, a cost, or a question."
    source: "book-voice.md rule 2"
  - id: V-S3
    name: explicit_decomposition
    rule: "Complex topics are broken into exactly two or three parts, the decomposition stated before it is solved, then each part solved in order."
    check: "Where a topic is decomposed, a sentence names the count and the parts before the first is addressed."
    source: "book-voice.md rule 3"
  - id: V-S4
    name: definitions_before_use
    rule: "Every new term gets a bold or boxed definition at first appearance, precise enough that two readers would understand it identically. A term is never used informally and defined later."
    check: "Every term in docs/definitions.yaml that a chapter uses is either defined in that chapter on first use or cited to the chapter that defines it (road-map.yaml: the `introduced` field)."
    source: "book-voice.md rule 4"
  - id: V-S5
    name: example_within_two_pages
    rule: "No concept stands as theory for more than two pages without a concrete example -- code, output, data, or a worked scenario from the evidence base."
    check: "Between any concept introduction and the next code block, table, figure, or worked scenario there are fewer than roughly 900 words."
    source: "book-voice.md rule 5"
  - id: V-S6
    name: summary_and_key_terms
    rule: "Every chapter ends with a summary restating what the reader can now do, matching the learning objectives, and a key-terms table with one-line definitions."
    check: "Final two sections are 'Summary' and a key-terms table; every term defined in the chapter appears in the table, and the summary covers each learning objective."
    source: "book-voice.md rule 6"
  - id: V-S7
    name: build_sections
    rule: >
      A chapter that carries the build thread closes its technical body with
      a Build section: the last numbered section before the summary, its
      heading beginning "Build:", constructing the piece of the part's build
      deliverable (outline.yaml: build_thread) that the chapter's mechanism
      explains. The deliverable is a declarative worked example (GH-114):
      where the build thread states the piece as a profile or a declared
      tool, the section builds it in that form, and it may cite the
      declarative-agents reference implementation as the grown version of
      the same design. Listings follow the figure apparatus: a bold
      "Listing N.M" line above a fenced code block with a language tag, an
      italic caption below, and a reference from the prose. The section
      demonstrates the mechanism as running code; it does not prescribe
      practice, so argument.yaml A-X1 binds inside it the same as outside.
    check: >
      Where a section heading contains "Build:", it is the last numbered
      section before Summary; every "Listing N.M" is followed by a fenced
      code block with a language tag and an italic caption, and is
      referenced from the section's prose.
    source: "GH-62 (build thread); GH-63 applies it to Part I; GH-114 repositions the deliverables as declarative worked examples"

prose_rules:
  - id: V-P1
    name: declarative_claims
    rule: "Technical claims are stated as facts. Qualification comes from data, not from hedges."
    check: "No 'interestingly', 'notably', 'it is worth noting', 'we believe' before a technical claim."
    source: "book-voice.md rule 7"
  - id: V-P2
    name: results_without_advocacy
    rule: "Data is presented without amplification; the reader draws the conclusion."
    check: "No 'excellent', 'impressive', 'powerful', 'dramatic' attached to a result."
    source: "book-voice.md rule 8"
  - id: V-P3
    name: short_sentences_anchor
    rule: "After a complex analytical passage, a short declarative sentence of five to ten words anchors the point."
    check: "Each long analytical passage is followed within a paragraph by a sentence under about twelve words."
    source: "book-voice.md rule 9"
  - id: V-P4
    name: no_hedging_on_the_known
    rule: "What is known is stated. What is not known is stated as unknown, with the reason. Uncertainty is never disguised as politeness."
    check: "No 'it seems that', 'one might argue', 'it could be the case', 'arguably'."
    source: "book-voice.md rule 10"
  - id: V-P5
    name: active_voice_third_person
    rule: "The technical body uses the active voice in the third person -- the pipeline generates, the harness executes, the suite verifies. First person is reserved for chapter introductions, sidebars, and passages where the author's own experience is the evidence."
    check: "First-person pronouns appear only inside a 'From the Field' sidebar, a chapter introduction, or an explicitly attributed passage."
    source: "book-voice.md rule 11"

voice_rules:
  - id: V-V1
    name: problem_first
    rule: "A tool, technique, or concept is introduced by the problem it solves, never by what it is."
    check: "The first mention of any named tool is preceded by the problem statement it answers."
    source: "book-voice.md rule 12"
  - id: V-V2
    name: concepts_through_need
    rule: "Vocabulary and frameworks arrive because the narrative requires them; the reader watches the problem demand the concept."
    check: "No concept is introduced in a section whose problem statement does not require it."
    source: "book-voice.md rule 13"
  - id: V-V3
    name: research_confirms_practice
    rule: "Field observation comes first, literature second. Citations use pandoc [@key] markers; author names are not written inline."
    check: "No sentence opens with a citation as its subject; no inline 'Smith et al. showed'; every [@key] resolves in references.yaml."
    source: "book-voice.md rule 14"
  - id: V-V4
    name: advisory_as_observation
    rule: "The reader is not told what to do. What was observed, what worked, and what failed are described; the reader draws the rule."
    check: "No second-person imperative stating a practice ('you should', 'always', 'never') outside a sidebar."
    source: "book-voice.md rule 15"
  - id: V-V5
    name: deflation_after_strong_claims
    rule: "A result that sounds impressive is immediately followed by the context that makes it honest."
    check: "Every headline number is followed within the same paragraph by its qualification."
    source: "book-voice.md rule 16"

forbidden_terms:
  source: "book-voice.md, 'What This Voice Is Not'"
  terms: [powerful, exciting, revolutionary, seamless, robust, cutting-edge, game-changing, effortless, magical, simply, just, obviously, clearly]
  note: >
    'Simply', 'just', 'obviously', and 'clearly' are barred because they
    assert the reader's experience rather than describe the mechanism. A
    term of art that trips this list stays; the exception is recorded in the
    chapter's completion note rather than the sentence being damaged to
    satisfy a grep.

sidebars:
  rule: "Four recurring types, adapted from Deitel. A sidebar carries the human voice; the technical body carries the argument."
  check: "Every sidebar uses one of the four labels verbatim and is one paragraph."
  types:
    - id: V-B1
      label: "Common Error"
      contains: "A specific mistake with a specific consequence."
      former_label: "Common Clauding Error"
    - id: V-B2
      label: "Good Practice"
      contains: "A pattern that works, stated as observation rather than instruction."
      former_label: "Good Clauding Practice"
    - id: V-B3
      label: "Performance Observation"
      contains: "A data point about cost, time, or efficiency."
    - id: V-B4
      label: "From the Field"
      contains: "A short first-person note from the author's experience -- an anecdote, an honest failure, the moment something worked."
      authorship: author_only
      rule: >
        The author writes these. A first-person claim about what happened to
        the author is the one kind of content an agent cannot supply, because
        an invented incident that reads plausibly is indistinguishable from a
        real one to every reader except the author.
      check: >
        git blame on the sidebar line: if the commit that last touched it
        carries a `Skill:` trailer, an agent wrote or edited it. Commit author
        does not discriminate, because agent commits carry the author's
        identity; the skill-tracing trailers do (GH-46). Last-touch rather
        than first-write is deliberate -- an agent editing the author's
        sidebar needs the same review as one inventing a sidebar.
      check_timing: >
        The check is silent on uncommitted changes, because blame reports an
        all-zero sha for a line that is not yet committed and there is no
        commit to judge. So a fix reads green before it is committed and the
        finding appears afterwards. Verify a V-B4 fix after committing, not
        before. GH-107 reached main exactly this way (GH-112).
      revert_note: >
        Reverting an agent's edit restores the prose and not the authorship.
        The revert is itself the last commit to touch those lines, so the
        finding survives with the author's own words in place. What clears it
        is a commit from the author touching the paragraph; GH-107 is the
        standing example, where the prose is the author's byte for byte and
        the blame is not.
      absent_trailer: >
        A commit with no `Skill:` trailer produces no finding, which is how a
        human commit passes and is the design working. It also means the check
        can be defeated by omitting the trailer, so that is recorded here as a
        known property: dropping the trailer to clear a V-B4 finding is
        suppression rather than a fix, and it costs the provenance the
        skill-tracing trailers exist to carry.
  renaming_note: >
    The first two labels drop "Clauding" per GH-12, which retires the term
    throughout. The labels above are canonical; GH-12 applies the rename to
    the drafted chapters.

section_numbering:
  rule: >
    Chapters are numbered by their position in the whole book, counting from
    the first chapter after the front matter and ignoring part boundaries.
    Sections carry that chapter number: chapter 7 has sections 7.1, 7.2, and
    subsections 7.3.1, 7.3.2. Part dividers, the introduction, and the
    references are not chapters and are not counted.
  rationale: >
    Decided at GH-35. The book previously numbered Part I's sections by
    position within the part while Part II kept absolute positions from an
    earlier arc, which put two section 2.1s and two section 4.1s in the same
    PDF. Any scheme keyed on position within a part collides across parts --
    C1.2 and C2.1 both reduce to 2 -- so the chapter number has to be
    book-wide. This also matches the Deitel apparatus the book already
    follows, and the figure numbering below, which was always book-wide.
  tradeoff: >
    Inserting a chapter renumbers every chapter after it, across parts. That
    is the accepted cost: it is the convention readers expect, and `mage
    audit` catches a stale number rather than leaving it to be noticed in a
    built PDF.
  check: >
    Every `## N.M` and `### N.M.K` heading in a chapter uses that chapter's
    book-wide position as N, and figure numbers agree.

figures:
  rule: "Every figure has three parts: a bold figure number above, the diagram, and an italic caption below."
  numbering: "Sequential within the chapter -- Figure 1.1, Figure 1.2, Figure 3.4. First number is the chapter's book-wide position (section_numbering), second the position within the chapter."
  caption: "Self-contained: a reader scanning the chapter understands the figure from the caption alone."
  checks:
    - "No figure without a caption."
    - "No figure duplicating what the prose already states; figures show structure or data, not concepts that are clearer in words."
    - "Every figure is referenced from the prose."
    - "A diagram with more than twelve nodes is decomposed into several figures."
  diagram_language:
    status: resolved
    rule: >
      Diagrams are PlantUML. The source is a versioned file under figures/,
      named fig-<chapter>-<figure>-<slug>.puml; mage figures renders it to a
      PNG beside it, and the chapter references the PNG with an image link
      between the bold figure number and the italic caption. Rendered PNGs
      are build artifacts and are not committed.
    rationale: >
      book-voice.md said Mermaid, and the two drafted chapters were written
      that way, but nothing rendered them: the build reads figures/*.puml and
      the pandoc path has no mermaid filter, so those blocks reached the PDF
      as literal code. Rendering Mermaid instead would have put a headless
      browser in the build chain for everyone who clones the book --
      mermaid-filter drives mermaid-cli through puppeteer, which needs its
      own Chromium. PlantUML needs only the plantuml and java the README
      already requires, it was already wired into mage figures, and it is the
      convention the author's other document repositories use
      (declarative-agents/design-patterns commits 33 .puml sources and
      gitignores their PNGs). Resolved at GH-21.
    tradeoff: >
      GitHub renders inline mermaid natively and does not render an
      uncommitted PNG, so figures no longer appear when reading a chapter on
      GitHub. The rendered book and the article versions are unaffected. If
      that becomes the binding constraint, commit the PNGs rather than
      switching the source format back.

register_test:
  statement: >
    Could a working programmer read this chapter, follow every definition and
    example, and apply the technique to their own project without re-reading
    it? If not, the chapter needs more examples, clearer definitions, or a
    simpler decomposition.
  source: "book-voice.md, 'Test'"

de_ai:
  rule: "Prose drafted with a model is scanned before it is committed; a flag is a prompt to look, not a verdict."
  passes:
    - name: pre_commit
      when: "After drafting a chapter, before the commit that adds it."
      scope: "The chapter's source markdown."
  accepted_residuals: >
    A term of art that trips a lexical scan stays, and the exception is
    recorded in the unit's completion comment. Definitions dense with
    citations may exceed the sentence-length guidance.
  source: "process.yaml: drafting_pipeline; the Prose workflow in do-work"
