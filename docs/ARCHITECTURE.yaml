          srd: docs/srd/srd-4.5-confidence-not-proof.yaml
    - id: P5
      title: Agent Orchestration
      role: "Running agent work past a single context window, and the failure modes that follow."
      chapters:
        - id: C5.1
          title: Why orchestrate
          srd: docs/srd/srd-5.1-why-orchestrate.yaml
        - id: C5.2
          title: Planning and generating
          srd: docs/srd/srd-5.2-planning-and-generating.yaml
        - id: C5.3
          title: The blackboard
          srd: docs/srd/srd-5.3-the-blackboard.yaml
        - id: C5.4
