          srd: docs/srd/srd-5.9-assembling-the-orchestrator.yaml
    - id: P6
      title: Instrumentation
      role: "Making the loop observable, so the pipeline changes on evidence rather than guesswork."
      chapters:
        - id: C6.1
          title: The black box problem
