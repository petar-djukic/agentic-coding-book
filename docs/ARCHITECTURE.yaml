# ARCHITECTURE.yaml -- how the Agentic Coding book is put together (GH-14).
# Simple by design: components, the part/chapter model, the dependency that
# orders it, and traceability. Goals live in VISION.yaml; binding rules live
# in docs/constitutions/ and are referenced here, never restated.

meta:
  name: agentic-coding-book
  governs: "repository root"
  version: 1

components:
  governance:
    path: docs/constitutions/
    role: "Binding rules in four strands (GH-16). The argument strand carries claim discipline -- observation over advocacy, deflation after strong claims, research confirming practice rather than leading it. The voice strand carries register, chapter apparatus, sidebar taxonomy, and figure conventions. The venue strand states what a practitioner book is and is not. The process strand states the drafting pipeline: SRD, draft, audit, critique, revise."
  steering:
    path: docs/
    role: "VISION.yaml (goals) and this file. road-map.yaml carries drafting order and per-chapter status; definitions.yaml carries the canonical terms (both GH-15). outline.yaml at the repository root remains the human-facing plan of record and must agree with the structure block below."
  chapters:
    path: "NN-slug.md (repository root)"
    role: "Markdown is the canonical source, numbered in reading order, with part dividers as their own files. Each chapter file names itself on its first line as `<!-- chapter: C1.6 -->`, which is what binds it to the `srd:` path below; the binding survives retitling and renumbering, and mage audit reports an unmarked chapter (GH-25). Prose carries pandoc [@key] citations; the build resolves them against references.yaml. Chapter apparatus -- learning objectives, summary, key terms, sidebars -- is prescribed by constitutions/voice.yaml."
  specification:
    path: docs/srd/
    role: "One Section Requirements Document per section (GH-17), each stating the section's goal, the book goals and claims it advances, its objective, the prior material it draws on, and its candidate citations. The SRD is the contract a drafter writes against; mage audit checks the mechanically checkable part of that contract, and the review-chapter skill judges the rest."
  figures:
    path: figures/
    role: "PlantUML sources under figures/, named fig-<chapter>-<figure>-<slug>.puml, compile to PNG via mage figures; chapters reference the PNG with an image link. The sources are versioned, the PNGs are build artifacts and gitignored (constitutions/voice.yaml: figures.diagram_language, resolved at GH-21)."
  build:
    path: "magefiles/, templates/"
    role: "mage figures renders figures/*.puml to PNG; mage pdf runs pandoc over the numbered chapters through templates/eisvogel.latex with xelatex, emitting into generated-files/; mage all chains the two. mage outline renders the SRDs to an outline PDF; mage audit checks specification consistency, prose conformance, and the build together (GH-27)."
  corpus_interface:
    path: references.yaml
    role: "Single CSL-YAML bibliography, resolved by the pandoc build and shared with the reference-maintenance skills. No private or per-chapter bibliography."

# The ordering principle. Part I is mechanism; Parts II-VI are practice.
# Every prescription in the practice parts must rest on a fact established
# in Part I, and a prescription that cannot name its Part I fact is a defect
# the audit reports.
dependency:
  rule: "Part I justifies Parts II-VI."
  direction: "Mechanism precedes practice; no practice part introduces mechanism of its own."
  examples:
    - "Specifications must be self-contained (Part II) because the harness reads whole files into context and cannot follow a cross-reference (Part I, how a harness touches your code)."
    - "Verification must be mechanical (Parts III and IV) because the model cannot grade its own output (Part I, how the LLM works and fails)."
    - "Intent must be written down (Parts II and V) because memory has to live somewhere the harness can reach (Part I, externalizing memory)."

structure:
  status: "Part I bound by GH-5; Parts II-VI carry the chapter list from outline.yaml and are bound as their SRDs are written."
  note: |
    Each unit names its SRD, the drafting contract under docs/srd/. GH-17
    writes the Part I SRDs; the Parts II-VI SRDs follow once those parts
    stabilize and are tracked as follow-on work. Chapter file names are
    omitted deliberately -- the Part I renumbering lands with GH-12, and
    binding a name here before then would encode a stale map.
  parts:
    - id: P1
      title: Agents and Harnesses
      role: "Mechanism. Establishes the vocabulary and the facts the rest of the book derives from."
      chapters:
        - id: C1.1
          title: What is an agent?
          srd: docs/srd/srd-1.1-what-is-an-agent.yaml
        - id: C1.2
          title: The agents you already use
          srd: docs/srd/srd-1.2-agents-you-already-use.yaml
        - id: C1.3
          title: What is a harness?
          srd: docs/srd/srd-1.3-what-is-a-harness.yaml
        - id: C1.4
          title: How a harness touches your code
          srd: docs/srd/srd-1.4-harness-touches-code.yaml
        - id: C1.5
          title: How the LLM works, and fails
          srd: docs/srd/srd-1.5-llm-works-and-fails.yaml
        - id: C1.6
          title: Externalizing memory
          srd: docs/srd/srd-1.6-externalizing-memory.yaml
    - id: P2
      title: Construction and Requirements
      role: "The construction decisions that precede a specification, then the specification itself."
      chapters:
        - id: C2.1
          title: Layered construction
          srd: docs/srd/srd-2.1-layered-construction.yaml
        - id: C2.2
          title: Language selection
          srd: docs/srd/srd-2.2-language-selection.yaml
        - id: C2.3
          title: Where requirements come from
          srd: docs/srd/srd-2.3-where-requirements-come-from.yaml
        - id: C2.4
          title: Writing specs for agents
          srd: docs/srd/srd-2.4-writing-specs-for-agents.yaml
        - id: C2.5
          title: The constitution
          srd: docs/srd/srd-2.5-the-constitution.yaml
        - id: C2.6
          title: Spec defects
          srd: docs/srd/srd-2.6-spec-defects.yaml
        - id: C2.7
          title: Task decomposition
          srd: docs/srd/srd-2.7-task-decomposition.yaml
    - id: P3
      title: Testing
      role: "Verifying code no human wrote, and the circularity problem when the tests are generated too."
      chapters:
        - id: C3.1
          title: Differential testing
          srd: docs/srd/srd-3.1-differential-testing.yaml
        - id: C3.2
          title: Generated tests
          srd: docs/srd/srd-3.2-generated-tests.yaml
        - id: C3.3
          title: Test infrastructure
          srd: docs/srd/srd-3.3-test-infrastructure.yaml
        - id: C3.4
          title: Property-based and fuzz testing
          srd: docs/srd/srd-3.4-property-based-and-fuzz-testing.yaml
        - id: C3.5
          title: Coverage and confidence
          srd: docs/srd/srd-3.5-coverage-and-confidence.yaml
    - id: P4
      title: How Do You Know Your Code Is Correct?
      role: "What correctness means when the volume exceeds human review capacity."
      chapters:
        - id: C4.1
          title: The trust problem
          srd: docs/srd/srd-4.1-the-trust-problem.yaml
        - id: C4.2
          title: Mechanical verification
          srd: docs/srd/srd-4.2-mechanical-verification.yaml
        - id: C4.3
          title: Code inspections at scale
          srd: docs/srd/srd-4.3-code-inspections-at-scale.yaml
        - id: C4.4
