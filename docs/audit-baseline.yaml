# audit-baseline.yaml -- findings mage audit reports but does not fail on (GH-27).
#
# The drafted chapters were written before the constitutions existed, so they
# predate the rules they are now measured against. Failing the build on that
# history would make the gate red from the day it shipped, and a gate that is
# always red gets turned off. Instead the debt is written down: each entry
# names the finding exactly and the issue that clears it.
#
# This is not an exemption list. Every entry is printed on each run, an entry
# without an `issue` is itself a finding, and an entry that no longer matches
# anything is reported as stale so the file cannot quietly outlive the defect.
# Delete entries as they are fixed; do not add one without an issue behind it.
#
# The `file`, `rule`, and `detail` fields must match a finding exactly -- run
# `mage audit` and copy the reported text.
#
# GH-12 cleared ten of the original thirteen: eight retired sidebar labels were
# renamed, and two findings against the old opening chapter left the audit's
# scope when that chapter was parked outside the numbered sequence as
# unplaced-intent-autonomy-and-verification.md. Those two defects still exist in
# that prose and are still tracked by GH-28; they will reappear here if the
# chapter is ever placed back into the book.

accepted:
  # --- Prose written before voice.yaml existed (GH-28) ---

  # --- Author's text, agent's blame (GH-107) ---

  - file: 10-layered-construction.md
    rule: 'voice.yaml: sidebars V-B4 authorship'
    detail: '"From the Field" sidebar #1 was last touched by the do-work skill; V-B4 is author_only'
    issue: GH-107
    note: >
      Different in kind from the two GH-44 entries below, and the difference
      matters. Those two sidebars were written by an agent, so the prose is
      not the author's. This one's prose is the author's original, byte for
      byte: GH-57 edited it to clear a cliche, then reverted the edit, and a
      revert does not restore authorship. Only the blame is an agent's.

      GH-107 clears it with one commit from the author touching the paragraph.
      Until then the finding is honest and should stay visible -- the last
      hand on that sidebar was not his.

  - file: 03-what-is-an-agent.md
    rule: 'voice.yaml: sidebars V-B4 authorship'
    detail: '"From the Field" sidebar #1 was last touched by the do-work skill; V-B4 is author_only'
    issue: GH-44
    note: >
      Section 1.3, on the skeleton becoming visible while rebuilding an agent.
      Written by an agent during GH-6 because srd-1.1 required the apparatus,
      and grounded in the declarative-agents work but not in a verified
      incident. GH-44 replaces it with the real one or cuts it.

  - file: 08-externalizing-memory.md
    rule: 'voice.yaml: sidebars V-B4 authorship'
    detail: '"From the Field" sidebar #1 was last touched by the do-work skill; V-B4 is author_only'
    issue: GH-44
    note: >
      Section 6.3, on a generation run that rebuilt a component against
      different assumptions. Same provenance, from GH-11.
