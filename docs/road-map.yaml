# Drafting roadmap for the Agentic Coding book (GH-15).
#
# Two views of the same plan. `releases` carries the drafting order and the
# gates between stages; `parts` carries every part and chapter with its
# current status, so a claim about what is drafted can be checked here rather
# than inferred from the file listing.
#
# The order follows the book's own dependency: Part I is mechanism and every
# practice part rests on it (ARCHITECTURE.yaml: dependency), so Part I drafts
# first. Within a release, a chapter is drafted against its SRD; no chapter
# opens before its SRD exists.

meta:
  artifact: "Book: Agentic Coding"
  ordering: "Part I first (mechanism before practice), then Parts II-VI in reading order"
  gates: >
    A drafting release opens once its SRDs exist under docs/srd/ and the
    constitutions it is checked against are in place. Each drafted chapter
    passes mage audit before its release closes -- no unaccepted finding
    against constitutions/voice.yaml -- and every claim resolves to a
    citation in references.yaml.
  specification: >
    The specification program closed at GH-71. All 39 chapters carry a
    drafting contract under docs/srd/, every derivation-chain link Q1-Q9 is
    owned, and the six relNN.srd releases are complete. Every drafting release
    below now gates on a real SRD rather than on background material the
    outline recorded as missing.

    Two things the program produced that are worth knowing before drafting.
    The contracts are not uniform in depth: the Part I objectives run around
    290 characters and the Part VI ones around 930, because the format matured
    across the five epics that wrote them. That is recorded rather than
    corrected -- padding the early ones would add words and no contract -- and
    a drafter reading the outline end to end should expect Part I to say less
    per chapter. And every figure the book states is pinned to the dataset
    snapshot recorded in outline.yaml's header, not refreshed against a
    growing corpus.

status_values:
  drafted: "full draft in the repository, cited, passing mage audit"
  partial: "draft material exists but does not yet match the chapter as specified"
  outline: "described in outline.yaml and ARCHITECTURE.yaml; no prose"
  unplaced: "drafted prose whose home in the current structure is unsettled"

releases:

  - id: rel00.0
    name: Structure
    status: complete
    units: [P1, P2]
    gate: >
      Completed at GH-5: outline.yaml encodes the mechanism-first Part I arc,
      the two construction chapters moved to the head of Part II, and the
      README and introduction structure tables agree with it.

  - id: rel00.1
    name: Specification
    status: complete
    units: [GH-14, GH-15, GH-16, GH-17]
    gate: >
      Completed under EPIC GH-13: VISION and ARCHITECTURE state the goals and
      the component model, road-map and definitions fill them in, four
      constitutions carry 60 rules with ids, and the SRD contract plus the six
      Part I SRDs bind chapters to those rules. Cross-checked: every rule an
      SRD cites exists, every chain link it claims is owned by that chapter in
      argument.yaml, every subgoal hangs off a VISION goal, and every citation
      and key term resolves.

  - id: rel00.2
    name: Tooling
    status: complete
    units: [GH-18, GH-19]
    gate: >
      Completed under EPIC GH-13 and corrected at GH-27: mage outline renders
      the SRDs to a PDF, and mage audit checks specification consistency,
      prose conformance, and the build together, reporting every finding by
      rule id. GH-19 first shipped the second half as an LLM API client; that
      was the wrong shape -- documentation checking here is deterministic, and
      the persona critique belongs in a skill the harness runs.

  - id: rel01.0
    name: "Part I -- Agents and Harnesses"
    status: complete
    units: [C1.1, C1.2, C1.3, C1.4, C1.5, C1.6]
    gate: "rel00.1 complete (the Part I SRDs are the drafting contracts). C1.5 additionally waits on GH-12, which frees the material it splits from."
    completed: >
      All six chapters drafted against their SRDs under EPIC GH-4 (GH-6, GH-7,
      GH-8, GH-9, GH-10, GH-11), 2026-08-11. Sections run 1.x to 6.x and the
      figures are 1.1, 2.1, 3.1, 4.1 and 6.1; C1.5 carries no figure. Known
      debt at completion: GH-35 (section and figure numbers collide with Part
      II, since C1.N -> section N.x is not injective across parts), GH-28
      (voice conformance in the pre-constitution drafts), and two From the
      Field sidebars written on the author's behalf that need replacing with
      the real incidents (C1.1 section 1.3, C1.6 section 6.3).

  - id: rel01.1
    name: "Resequencing and terminology retirement"
    status: complete
    units: [GH-12]
    gate: >
      Completed at GH-12, ahead of rel01.0 rather than alongside it: the
      files are renumbered to the current arc, the coined term is retired from
      every chapter, and the sidebar labels are the canonical four. Doing it
      first meant the Part I chapters get drafted into a sequence that is
      already correct.

  - id: rel02.srd
    name: "Part II specification"
    status: complete
    units: [C2.1, C2.2, C2.3, C2.4, C2.5, C2.6, C2.7]
    gate: "rel01.0 complete, and Q9 existing in argument.yaml -- C2.1 and C2.2 owned no derivation-chain link until GH-86, so their contracts could not be written."
    completed: >
      Seven SRDs written under EPIC GH-66, 2026-08-13. C2.1 and C2.2 were
      written against existing prose per contract rule 1, so their gaps fields
      carry the draft-versus-contract disagreements that rel02.0 reframes. The
      other five were written before drafting, in the intended order.

      Open seams recorded in the SRDs rather than settled here: the Build split
      between C2.4's spec loader and C2.5's constitution gate, which
      outline.yaml names as one obligation; and the specification-versus-
      generation defect distinction that C2.1 section 7.5.1 already draws and
      C2.6 owns.

  - id: rel02.0
    name: "Part II -- Construction and Requirements"
    status: pending
    units: [C2.1, C2.2, C2.3, C2.4, C2.5, C2.6, C2.7]
    gate: "rel02.srd complete. C2.1 and C2.2 are already drafted and need reframing against their contracts rather than first drafting; the disagreement lists are in the two SRDs."

  - id: rel03.srd
    name: "Part III specification"
    status: complete
    units: [C3.1, C3.2, C3.3, C3.4, C3.5]
    gate: "rel02.srd complete."
    completed: >
      Five SRDs written under EPIC GH-67, 2026-08-13, all before drafting --
      no Part III chapter exists, so none needed writing against prose the way
      C2.1 and C2.2 did.

      Two seams recorded rather than settled: verification_stack is still
      introduced at P3 in definitions.yaml because GH-78 claims it for Part IV,
      and the build-thread split between C3.3's standalone harness and Part
      IV's wiring of it into the loop needs srd-4.x to take the harness as
      given rather than rebuild it.

  - id: rel03.0
    name: "Part III -- Testing"
    status: pending
    units: [C3.1, C3.2, C3.3, C3.4, C3.5]
    gate: "rel03.srd complete, and rel02.0 (testing verifies what the specification asked for)."

  - id: rel04.srd
    name: "Part IV specification"
    status: complete
    units: [C4.1, C4.2, C4.3, C4.4, C4.5]
    gate: "rel03.srd complete."
    completed: >
      Five SRDs written under EPIC GH-68, 2026-08-13. C4.2 claims the six-layer
      verification stack from the parked file and takes verification_stack with
      it, P3 to C4.2. C4.3's reviewer-of-the-reviewer problem is grounded in
      Knight and Leveson 1986 and its 2026 replication for coding agents.

      One figure could not be sourced: outline.yaml gives C4.5 "the churn
      metric (3.7% in Run 31)", and while run gh-799-run31 is well recorded,
      churn in that corpus is a per-file Edit/Write count rather than a
      percentage and no run-31 ratio is 3.7%. A-C2 treats it as missing; the
      SRD says so and GH-92 covers outline.yaml's numeric claims as a class.

  - id: rel04.0
    name: "Part IV -- Correctness"
    status: pending
    units: [C4.1, C4.2, C4.3, C4.4, C4.5]
    gate: "rel04.srd complete, and rel03.0 (correctness is the stronger claim testing cannot make on its own)."

  - id: rel05.srd
    name: "Part V specification"
    status: complete
    units: [C5.1, C5.2, C5.3, C5.4, C5.5, C5.6, C5.7, C5.8, C5.9]
    gate: "rel04.srd complete."
    completed: >
      Nine SRDs written under EPIC GH-69, 2026-08-14. Ownership settled for
      four glossary terms that had sat at part level: planner and generator to
      C5.2, knowledge_manager to C5.9, and orchestrator to C1.3, whose Key
      Terms table already defines it to draw the harness/orchestrator
      contrast.

      The two blocking gaps are now specific rather than general. Beads is
      thinly evidenced rather than missing -- the bd commands exist in
      coding-skills and three repositories carry a .beads/issues.jsonl, whose
      record shape is C5.3's four records exactly, but the corpora hold 6 and
      15 records against a GitHub tracker with four-digit issue numbers, so
      what is absent is a run at scale. Dolt is absent outright: no schema, no
      run, and no mention anywhere in cobbler-scaffold. srd-5.5 is therefore
      written file-first with the database treated generically, so drafting is
      not blocked on a product the corpus does not have.

      Two outline defects recorded. GH-1361 is labelled "premature stops" but
      is premature completion; the premature stop is GH-1475. And "the
      31-tries iteration story" has no artifact behind it -- srd-5.9 is
      written against runs.csv instead, where 60 runs, 23 of them producing no
      tasks and 7 abandoned, tell the same story verifiably. GH-92 covers the
      numeric claims as a class.

  - id: rel05.0
    name: "Part V -- Agent Orchestration"
    status: pending
    units: [C5.1, C5.2, C5.3, C5.4, C5.5, C5.6, C5.7, C5.8, C5.9]
    gate: >
      rel04.0 complete and rel05.srd complete. Two chapters carry background
      dependencies the SRDs state precisely: C5.4 needs a beads run at
      something like the scale of the GitHub half, and C5.5 needs a decision
      rather than a document -- build a versioned-database blackboard, or keep
      the chapter file-first and name no product. srd-5.4 and srd-5.5 hold the
      detail in their gaps fields.

  - id: rel06.srd
    name: "Part VI specification"
    status: complete
    units: [C6.1, C6.2, C6.3, C6.4, C6.5, C6.6, C6.7]
    gate: "rel05.srd complete."
    completed: >
      Seven SRDs written under EPIC GH-70, 2026-08-14, completing the
      specification for all six parts. `monitor` assigned to C6.2 and
      `analyst` to C6.7, both having sat at part level with no owning chapter;
      GH-94's remaining three orphaned roles still stand.

      This part has the strongest evidence base in the book, and the contracts
      are written against named dataset files rather than against the
      outline's summaries. Two findings carry chapters on their own: retrying
      is worth about two points, with pass@1 at 0.7743 rising only to 0.795 by
      pass@18 across 678 task ids; and tasks carry a floor of roughly $1.32
      before any work, against about a penny per requirement, which deflates
      cost per line without any help from the argument.

      Three outline promises could not be met as written. The economics
      figures do not reproduce -- "$139.24 for 44,628 lines" appears in no
      dataset and implies $3.12 per kLOC against a corpus median of $9.78, so
      the two numbers are not from one scope (GH-92). C6.5's promise of
      predicting expensive tasks before they run is unsupported: the corpus's
      fitted model predicts tool calls rather than cost, nine of its thirteen
      features are outcomes, and it does worse than the mean on failed builds.
      And the turn-level figures throughout cover 659 task ids against 2,706
      tasks, which every chapter using them must state.

  - id: rel06.0
    name: "Part VI -- Instrumentation"
    status: pending
    units: [C6.1, C6.2, C6.3, C6.4, C6.5, C6.6, C6.7]
    gate: >
      rel05.0 complete (instrumentation observes the loop the previous part
      builds) and rel06.srd complete. Two measurements are worth making before
      drafting rather than after: whether GH-7's single-turn fix removed the
      input-token variance it was written to remove, which would turn C6.6's
      strongest section from a proposal into a result; and a model refitted on
      pre-run features alone, which would give C6.5 the number the outline
      assumed it already had.

