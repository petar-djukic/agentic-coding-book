# Drafted prose with no chapter in the current structure. Recorded here so it
# is not mistaken for lost work, and so the material is placed deliberately
# rather than by whoever next opens the file.
unplaced:
  - source: unplaced-intent-autonomy-and-verification.md
    status: unplaced
    holds: >
      Behavioral and constructional intent, the six autonomy levels, and the
      verification stack -- three concepts the book still needs, in a chapter
      whose framing GH-5 retired. The intent pair reads as Part II material,
      the verification stack as Parts III-IV, and the autonomy levels have no
      settled home: the introduction still frames the whole book on them
      (01-introduction.md, "How the book is arranged").
    owner: >
      Needs an owner. GH-12 parked the file outside the numbered sequence so
      the build skips it and the prose survives, and retired the term it was
      named for, but placing the three concepts is a drafting decision nobody
      holds yet.

# The migration this file completes.
supersedes:
  - path: dictionary.yaml
    by: docs/definitions.yaml
    note: >
      All 57 terms migrated. The old file remains in place until GH-12 stops
      referencing it; delete it in that pass rather than leaving two
      glossaries that can disagree.
