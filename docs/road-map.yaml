# Drafted prose with no chapter in the current structure. Recorded here so it
# is not mistaken for lost work, and so the material is placed deliberately
# rather than by whoever next opens the file.
unplaced:
  - source: unplaced-intent-autonomy-and-verification.md
    status: unplaced
    holds: >
      Every fragment now has a named SRD destination, so nothing here is
      unhomed. What remains is a move, not a decision.

      The intent pair and its worked notification-system example, the
      Strategy-pattern figure and the Common Error sidebar: claimed by srd-2.4
      at GH-66. The boxed definitions of behavioral and constructional intent
      already went to C1.5 section 5.4.1 at GH-43.

      The six-layer verification stack with its Good Practice and From the
      Field sidebars: claimed by srd-4.2 at GH-68, which also took
      verification_stack from P3 to C4.2. The framing of verification as two
      questions -- code against specification, specification against intent --
      is claimed by srd-4.1.

      The per-level autonomy walkthrough and its two tables: resolved at
      GH-43, which found less left to move than GH-68 assumed. The
      bottleneck-by-level table is claimed by srd-4.5, whose closing argument
      is that table's L5 row -- what stops a system managing its own evolution
      is verification trust rather than capability. The walkthrough is already
      drafted: C2.1 section 7.6 treats L2, L3 and L4 one at a time against the
      two loops, and C1.6 carries the definition with the L0 and L5 endpoints.
      What stayed parked is L1 and a fuller L5, neither of which earns a
      section. The programmer-role-by-level table is retired rather than
      placed, because its middle rows restate 7.6 in a table; srd-2.1 records
      the one sentence in it worth keeping if that chapter is revised.

      Already absorbed and removed from the file: the in-the-loop and
      on-the-loop definitions to C1.6 section 6.4 at GH-11; the
      compounding-advantage passage, already in 01-introduction.md; the
      autonomy_level definition and the L0/L5 endpoints to C1.6 section 6.5 at
      GH-11; and the boxed definition of agentic_coding to 01-introduction.md
      at GH-60, which took the last use of the retired term with it.
    owner: >
      No longer needs one. GH-12 parked the file outside the numbered sequence
      so the build skips it and the prose survives; every fragment now has
      either a destination named by an SRD or a recorded reason for being
      retired. The file stays until the chapters that claim it are drafted,
      because srd-2.4, srd-4.1, srd-4.2 and srd-4.5 point at it by path and
      deleting the prose would leave four contracts citing material that no
      longer exists.

