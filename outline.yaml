# Agentic Coding — Document Outline
# This is the single source of truth for the book structure.

title: "Agentic Coding"
subtitle: "How to Build Software with Coding Agents — and Build the Agents Themselves"
author: "Petar Djukic"

# Figures in this book are pinned to a snapshot, not refreshed against a
# growing corpus (GH-71). The corpora keep generating; a book cannot chase
# them, and a figure that silently changes between printings is worse than a
# dated one. So every number in the outline, the introduction, and the
# chapters names the dataset it came from, and the dataset is the snapshot
# recorded in go-unix-utils analysis/datasets/ at the state described below.
# A-C2 already requires each number to name its run; this fixes what "its
# run" means across the book.
#
# The snapshot, read at GH-71:
#   60 pipeline runs, of which 37 merged, 8 finished, 8 in progress, 7
#   abandoned, and 23 produced no tasks at all
#   2,706 tasks over 2,610 unique task ids (economics_summary.yaml); note
#   runs.csv sums to 2,718 and the two are not reconciled -- cite the file
#   45,789 lines of production Go at peak, 32,975 at latest
#   115 specified targets: 109 commands and 6 packages; 107 command
#   implementations present on disk
#   $3,677.06 total cost, 1,951 wall-clock hours
#   659 task ids with turn-level transcripts -- roughly a quarter, so every
#   per-turn figure is over the instrumented subset and must say so
#
# Refreshing the snapshot means re-reading every figure that cites it, which
# is the cost of the policy and the reason to do it once, late.

# The build thread (GH-62). The reader builds a small declarative coding
# harness across the book and grows it into an orchestrator in Part V. Each
# part's prose stays mechanism-first; each part ends having added a working
# component, recorded per part under build_deliverable. The artifact is
# written in Go — the language C2.2 argues for and the language of the
# evidence base. It is pedagogical and usable, distinct from cobbler-scaffold
# and go-unix-utils, which remain the production evidence.
build_thread: >
  Part I: the harness skeleton — state machine, tool table, edit application,
  one verification gate. Part II: the spec loader (context assembly from a
  PRD) and the constitution as an enforced policy gate. Part III: a
  differential test harness, built standalone. Part IV: the verification
  stack wired into the loop as gates, and an inspector sub-agent. Part V: a
  planner and a generator coordinated through a blackboard, assembled into
  the orchestrator. Part VI: instrumentation of the reader's own harness.

parts:
  - id: part-i
    title: "Agents and Harnesses"
    directory: part-i-agents-and-harnesses
    status: outline
    description: >
      Part I is mechanism, not practice. It establishes what an agent is, what
      a harness is, how a harness actually manipulates the file system, where
      the underlying model breaks, and where state lives between sessions —
      before the book prescribes anything.

      The harness is the protagonist. The LLM never touches the file system;
      the harness does. The reader's job across the rest of the book is
      shaping how that harness behaves.

      The payoff is structural: every "do it this way" in Parts II–VI is
      justified by a Part I fact — because the harness reads the whole file
      into context, because the model cannot grade its own output, because
      memory has to live somewhere the harness can reach.

      Build deliverable: the harness skeleton — a state machine, a tool
      table, edit application, and one verification gate. Planned as
      end-of-chapter Build sections added in a later pass; the drafted
      prose is untouched until that pass amends the chapters and their SRDs.
    chapters:
      - title: "What is an agent?"
        status: outline
        description: >
          The clean model: a state machine plus a set of tools. Declarative
          agents as the reference lens — the version where the skeleton is
          still visible. Cross-references the Agentic Applications volume,
          which builds agents this way rather than borrowing the model.
      - title: "The agents you already use"
        status: outline
        description: >
          OpenCode, Claude Code, and LangGraph-flavored agents surveyed
          against that model. The same skeleton in different clothes, and
          what each one hides.
      - title: "What is a harness?"
        status: outline
        description: >
          Coding with an agent is using a harness. The software wrapped
          around the model: tool execution, file-system access, loop control,
          and policy.
      - title: "How a harness touches your code"
        status: outline
        description: >
          The harness ↔ file system ↔ compiler sequence diagram, and the
          generate → verify → feed-back loop as the harness's heartbeat.
          The LLM never touches the file system; the harness does.
      - title: "How the LLM works, and fails"
        status: partial  # split from the drafted 05-how-the-machine-works.md
        description: >
          Next-token prediction, tokens and context budgets, the
          interpolation model, and the four failure modes. The part inside
          the harness that makes the mistakes the rest of the harness exists
          to catch.
      - title: "Externalizing memory"
        status: outline
        description: >
          The harness feature that carries state across sessions, and the
          exact moment the human leaves the loop. The hinge out of mechanism
          and into the practice of Parts II–VI.
    notes:
      relocated: >
        "Layered construction" and "Language selection" left Part I for
        Part II — they are construction and decision practices, not
        machine mechanics. GH-12 moved the files and renumbered the
        sequence.
      retired: >
        Two never-drafted Part I outline chapters were dropped in the
        restructure: "The agency argument" (build your own tooling — the
        argument survives in the introduction and Part V's "Building your
        own") and "The repositories" (the cobbler-scaffold and
        go-unix-utils tour, whose framing was never settled; the evidence
        base is introduced where it is first used instead).

  - id: part-ii
    title: "Construction and Requirements"
    directory: part-ii-requirements  # path unchanged to avoid churn; #12 revisits
    status: outline
    description: >
      Part I established the mechanism. This part starts the practice with the
      two decisions that precede any spec — how construction is ordered, and
      what language the model will be writing — and then turns to the spec
      itself.

      The spec is the source code now. When you work with coding agents, the
      quality of the output is determined by the quality of the requirements
      you give them. Bad specs produce bad code, and the failure modes are
      specific and traceable.

      This part covers where requirements come from, how to write them so
      agents can execute them reliably, and what goes wrong when you don't.
      It draws on the PRD structure used in go-unix-utils, where every
      utility is specified in a YAML requirements document before any code
      is generated.

      The deeper point: requirements engineering is the skill that separates
      programmers who use agents effectively from those who fight them. Most
      programmers have never written a formal spec because they carried the
      requirements in their head while they coded. That doesn't work when
      someone (something) else is doing the coding.

      Build deliverable: the spec loader — context assembly from a PRD —
      and the constitution as an enforced policy gate in the reader's
      harness.
    chapters:
      - title: "Layered construction"
        status: drafted  # relocated from Part I; file move tracked in #12
        description: >
          Inner and outer loops; tracer bullets; verification gates; why
          agents automate only one loop. Sets the increment order that the
          requirements chapters then specify against.
      - title: "Language selection"
        status: drafted  # relocated from Part I; file move tracked in #12
        description: >
          Language-model pairing; interpolation density; grammar complexity;
          the compiler in the inner loop. The substrate decision every
          project makes before the first spec is written.
      - title: "Where requirements come from"
        description: >
          Standards (POSIX), reference implementations (GNU coreutils), RFCs,
          existing codebases, domain knowledge. How to extract behavior specs
          from working software.
      - title: "Writing specs for agents"
        description: >
          Anatomy of a good PRD. Requirement IDs, acceptance criteria,
          self-contained context. Why cross-references fail (the agent can't
          read the other document). Go function signatures, struct fields, and
          format strings inline. (go-unix-utils #31, #2608)
      - title: "The constitution"
        description: >
          Execution rules as machine-readable constraints. Line limits, DRY
          thresholds, coding standards. Why soft guidance doesn't work and
          hard gates do. (go-unix-utils #2610)
      - title: "Spec defects"
        description: >
          Common failure modes: ambiguous behavior, missing edge cases,
          contradictory rules, under-specified prompts. How to trace a
          generated code defect back to the spec that caused it.
      - title: "Task decomposition"
        description: >
          Scoping work for agents. One requirement per task. What happens
          when tasks are too big or too small, read off the measured turn
          distribution rather than from a single case. The calibration
          problem. (go-unix-utils #167, #45)
    background_needed:
      - Example PRDs from go-unix-utils (good and bad)
      - The execution constitution YAML
      - Examples of spec defects and their downstream effects

  - id: part-iii
    title: "Testing"
    directory: part-iii-testing
    status: outline
    description: >
      How do you test code you didn't write? This part covers the testing
      approaches available when agents generate the code — from differential
      testing to generated test suites to property-based testing and beyond.

      The central tension: if you use an agent to generate the code, can you
      trust an agent to generate the tests? If not, who writes them? If yes,
      how do you verify the tests themselves? This part works through the
      options.

      Build deliverable: a differential test harness, built standalone here;
      Part IV wires it into the loop as a gate.
    chapters:
      - title: "Differential testing"
        description: >
          Same input, two implementations, compare output. Using the original
          software as the test oracle. Why this is the gold standard for
          migrations and reimplementations. (go-unix-utils approach: GNU
          coreutils as reference)
      - title: "Generated tests"
        description: >
          Using Claude to write test suites. When this works (clear specs,
          well-defined behavior) and when it doesn't (the tests encode the
          same misunderstanding as the code). Translated tests vs.
          independently generated tests.
      - title: "Test infrastructure"
        description: >
          Building harnesses that automate comparison across flag
          combinations, edge cases, and input ranges. Using agents to build
          the test infrastructure itself.
      - title: "Property-based and fuzz testing"
        description: >
          When you can define invariants but not enumerate cases. Using
          properties ("sort output must be sorted", "cp output must be
          byte-identical to input") as verification.
      - title: "Coverage and confidence"
        description: >
          What testing catches and what it misses. When to stop testing.
          How much coverage is enough for generated code.
    background_needed:
      - go-unix-utils test suite examples
      - Differential test harness code
      - Examples of generated tests that were wrong
      - Any property-based or fuzz testing work from the repos

  - id: part-iv
    title: "How Do You Know Your Code Is Correct?"
    directory: part-iv-correctness
    status: outline
    description: >
      This is the philosophical center of the book. Testing tells you whether
      specific inputs produce expected outputs. Correctness is a stronger
      claim. When you didn't write the code and can't read all of it, how do
      you build confidence that it does what it should?

      This part sits between testing (Part III) and orchestration (Part V)
      because the answer to "how do you know?" shapes how you design the
      pipeline, what gates you enforce, and how much autonomy you give the
      agents.

      Build deliverable: the verification stack wired into the reader's
      harness loop as gates, and an inspector sub-agent that reviews
      generated output.
    chapters:
      - title: "The trust problem"
        description: >
          You can't read the output of a pipeline that generated tens of
          thousands of lines across 60 runs. You can't review every
          function. What does "correct" mean when the programmer didn't
          write the code?
      - title: "Mechanical verification"
        description: >
          Compiler, linter, test suite, differential tests: the stack of
          automated checks. Why each layer catches different classes of
          defects. Hard gates vs. soft guidance.
      - title: "Code inspections at scale"
        description: >
          What code inspection looks like when the volume exceeds human review
          capacity. Using agents to review agent output. The reviewer problem:
          who reviews the reviewer?
      - title: "Correctness by construction"
        description: >
          Writing specs so tight that correct code is the only possible
          output. The relationship between spec precision and output quality.
          When this works (formal specs like POSIX) and when it doesn't
          (ambiguous domains).
      - title: "Confidence, not proof"
        description: >
          In practice, you're building confidence through layers of
          evidence, not proving correctness. Reading a run's waste as
          evidence -- retries, zero-output tasks, near-timeouts -- and
          deciding when to ship and when to hold.
    background_needed:
      - Examples of code that passed all tests but was still wrong
      - Examples of spec-level fixes that prevented entire classes of defects
      - The churn data and what it tells you about quality
      - Any code inspection tooling or agent-reviews-agent patterns

  - id: part-v
    title: "Agent Orchestration"
    directory: part-v-orchestration
    status: outline
    description: >
      When one Claude session isn't enough, you need orchestration: multiple
      agents with different roles, coordinated through shared state, producing
      code at a scale that a single conversation can't handle. This part
      covers the architecture and mechanics of multi-agent code generation.

      This is the most technically dense part of the book. Three ideas carry
      it: planning and generating as the two agent roles, the blackboard as
      the coordination substrate the roles read and write, and the
      orchestrator as the process that manages the sub-agent lifecycle.
      cobbler-scaffold supplies the production evidence; its internal
      vocabulary appears only as annotation. The reader should come away
      having built their own orchestration layer, not just understood one.

      Build deliverable: a planner and a generator coordinated through a
      blackboard the reader implements — first as a YAML file, then as a
      Dolt database — assembled into the orchestrator with a sub-agent
      lifecycle manager.
    chapters:
      - title: "Why orchestrate"
        description: >
          The limits of single-session generation. Context windows, task
          scope, sustained execution. When you need more than one agent.
      - title: "Planning and generating"
        description: >
          Two agent roles with different jobs: the planner decomposes and
          orders work, the generator implements one task in an isolated
          worktree. Why planning costs more than generation. The
          plan/generate cycle maps to the outer-loop steps named in
          "Layered construction".
      - title: "The blackboard"
        description: >
          The coordination substrate as a concept: shared state that agents
          read and write. What it must record — task state, claims,
          handoffs, history. The blackboard-architecture lineage, and why a
          project tracker becomes infrastructure when agents are the
          workers.
      - title: "Off-the-shelf blackboards: GitHub and beads"
        description: >
          GitHub issues as task queue, labels as state machine, comments as
          handoff, and the API race conditions that follow
          (cobbler-scaffold #1475, #1467). Then beads, the git-backed issue
          tracker driven by bd, as the purpose-built alternative: offline,
          diffable, no rate limits.
      - title: "Build your own blackboard"
        description: >
          A YAML-file blackboard first -- diffable, single-writer, enough
          for one orchestrator. Then the three pressures that end it:
          concurrent writers, queries about the run rather than about a
          task, and audit. What a versioned store supplies for each, and
          why the graduation is a condition to check rather than a step to
          take.
      - title: "The sub-agent lifecycle"
        description: >
          The orchestrator spawns, configures, monitors, collects, and
          kills sub-agents. Worktree isolation, one task per worktree.
          Agent configurations: per-role prompt, tools, and constraints.
      - title: "State management and recovery"
        description: >
          requirements.yaml, road-map.yaml, the consistency problem. What
          happens when state isn't committed (#1385), when status isn't
          reverted (#1469), when progress is lost on restart (#1389).
      - title: "Failure modes"
        description: >
          Race conditions with the GitHub API, which also produce
          premature stops (#1475), stale branches causing infinite retries
          (#1561), no backoff on failures (#1562), and a whole release
          marked implemented after a single task (#1361). Distributed
          systems problems in agent orchestration.
      - title: "Assembling the orchestrator"
        description: >
          The parts become the whole: planner, generator, blackboard, and
          lifecycle manager in one loop. CLI vs. SDK (#687). The iteration
          history as runs.csv records it -- 60 runs, 23 of which produced
          no tasks and 7 abandoned -- and why building it yourself is the
          point.
    background_needed:
      - "Beads: a bd usage walkthrough for the off-the-shelf chapter"
      - "Dolt: a blackboard schema sketch for the build-your-own chapter"
      - "Sub-agent lifecycle examples from cobbler-scaffold"
      - cobbler-scaffold architecture diagram or walkthrough
      - Examples of coordination failures and their fixes

  - id: part-vi
    title: "Instrumentation"
    directory: part-vi-instrumentation
    status: outline
    description: >
      Claude is a black box until you instrument it. This part covers how to
      observe, measure, and diagnose what agents are doing — and how
      instrumentation changes your relationship with the tools from guessing
      to understanding.

      The turning point in cobbler-scaffold wasn't a prompt fix or a
      redesign — it was adding logging. Before that, you'd kick off a run,
      come back, and either it worked or it didn't. After logging turn counts,
      cost per task, tool usage, and failure modes, you could see what was
      happening and make informed decisions about what to optimize. This part
      teaches that skill.

      Build deliverable: instrumentation of the reader's own harness — turn
      counts, cost per task, tool usage, failure modes — so the receipts
      they learn to read are their own.
    chapters:
      - title: "The black box problem"
        description: >
          Before instrumentation: no visibility into what Claude is doing,
          why tasks fail, or where the money goes.
      - title: "What to log"
        description: >
          Turn counts, cost per task, tool usage patterns, failure modes,
          rate limit events, context size, token counts. What each metric
          tells you.
      - title: "Reading the logs"
        description: >
          Spotting thrashing as a tail of your own turn distribution
          rather than at a borrowed threshold, the waste patterns behind
          it (edit-match-fail loops, compile-fix cycles), and context
          degradation. (#1453)
      - title: "The economics"
        description: >
          Reading the receipt at task granularity. Where the money goes,
          cost trends across runs, and the floor -- no measured property
          of a specification predicts what its task will cost. What cost
          per line means and doesn't mean.
      - title: "Building intuition"
        description: >
          After enough instrumented runs you develop a sense for which
          work goes badly -- compound scope, behavior interactions, byte-
          level matching -- and the corpus's own attempt to formalise that
          sense shows why it stays a human skill. This intuition feeds
          back into how you write requirements.
      - title: "Non-determinism"
        description: >
          Same prompt, different results. Thinking token variance cascading
          through pipeline stages. Why reproducibility is hard and what you
          can do about it. (#5, #7)
      - title: "Stats and post-run analysis"
        description: >
          The generation report. Stats inaccuracies and how to fix them
          (#1445, #1449, #1450). The cleanup checklist (#2627). Treating
          generation as a manufacturing process with quality control.
    background_needed:
      - cobbler-scaffold logging output examples
      - Generation run reports (run 28, run 31)
      - Examples of stats before/after instrumentation improvements
      - A turn-by-turn analysis of one long-running task as a debugging walkthrough (the sort R4 case named here does not resolve; see GH-92)
